    TRANSACTIONS:
      SLOT: 51
      MATERIAL: WRITABLE_BOOK
      NAME: '&fTransactions'
      LORE:
      - '&o&7Click to view your transactions'
    NEXT:
      SLOT: 53
      MATERIAL: ARROW
      NAME: '&fNext page'
      LORE:
      - '&o&7Click to view next page'

